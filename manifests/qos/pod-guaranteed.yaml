apiVersion: v1
kind: Pod
metadata:
  name: pod-guaranteed
  namespace: qos-lab
  labels:
    app: pod-guaranteed
    app.kubernetes.io/name: pod-guaranteed
    app.kubernetes.io/part-of: kubernetes-lab-namespaces-resources
    app.kubernetes.io/managed-by: kubectl
spec:
  containers:
  - name: nginx
    image: nginx:1.27-alpine
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"
