apiVersion: v1
kind: LimitRange
metadata:
  name: limitrange-default
  namespace: limitrange-lab
  labels:
    app.kubernetes.io/name: limitrange-default
    app.kubernetes.io/part-of: kubernetes-lab-namespaces-resources
    app.kubernetes.io/managed-by: kubectl
spec:
  limits:
  - type: Container
    defaultRequest:
      cpu: "100m"
      memory: "128Mi"
    default:
      cpu: "500m"
      memory: "256Mi"
